name: Academic Year System - Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - 'backend/src/services/academic-year/**'
      - 'backend/src/routes/academic-calendar.ts'
      - 'backend/src/routes/student-lifecycle.ts'
      - 'backend/src/routes/faculty-operations.ts'
      - 'backend/src/routes/course-execution.ts'
      - 'backend/src/routes/workflow-notifications.ts'
      - 'k8s/academic-year/**'
      - '.github/workflows/academic-year-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: scrolluniversity/academic-year-system
  KUBERNETES_NAMESPACE: academic-year-system

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: academic_year_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Run linting
        working-directory: backend
        run: npm run lint
      
      - name: Run type checking
        working-directory: backend
        run: npm run type-check
      
      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/academic_year_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: npm run test:academic-year
      
      - name: Run property-based tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/academic_year_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: npm run test:property:academic-year
      
      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/academic_year_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: npm run test:integration:academic-year
      
      - name: Generate coverage report
        working-directory: backend
        run: npm run test:coverage:academic-year
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: academic-year-system
          name: academic-year-coverage
  
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run npm audit
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true
  
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.academic-year
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
      
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
      
      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-image-results.sarif'
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://academic-year-staging.scrolluniversity.com
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}
      
      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.KUBERNETES_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Deploy to staging
        run: |
          kubectl apply -f k8s/academic-year/namespace.yaml
          kubectl apply -f k8s/academic-year/configmap.yaml
          kubectl apply -f k8s/academic-year/secrets.yaml
          kubectl apply -f k8s/academic-year/deployment.yaml
          kubectl apply -f k8s/academic-year/ingress.yaml
          
          kubectl set image deployment/academic-year-system \
            academic-year-system=${{ needs.build.outputs.image-tag }} \
            -n ${{ env.KUBERNETES_NAMESPACE }}
          
          kubectl rollout status deployment/academic-year-system \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            --timeout=10m
      
      - name: Run smoke tests
        run: |
          kubectl run smoke-test \
            --image=curlimages/curl:latest \
            --rm -i --restart=Never \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            -- curl -f http://academic-year-system/api/health || exit 1
      
      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Academic Year System deployed to staging'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
  
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://academic-year.scrolluniversity.com
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
      
      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.KUBERNETES_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Backup current deployment
        run: |
          kubectl get deployment academic-year-system \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            -o yaml > deployment-backup-$(date +%Y%m%d-%H%M%S).yaml
      
      - name: Deploy to production
        run: |
          kubectl apply -f k8s/academic-year/namespace.yaml
          kubectl apply -f k8s/academic-year/configmap.yaml
          kubectl apply -f k8s/academic-year/secrets.yaml
          kubectl apply -f k8s/academic-year/deployment.yaml
          kubectl apply -f k8s/academic-year/ingress.yaml
          
          kubectl set image deployment/academic-year-system \
            academic-year-system=${{ needs.build.outputs.image-tag }} \
            -n ${{ env.KUBERNETES_NAMESPACE }}
          
          kubectl rollout status deployment/academic-year-system \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            --timeout=15m
      
      - name: Run health checks
        run: |
          for i in {1..10}; do
            kubectl run health-check-$i \
              --image=curlimages/curl:latest \
              --rm -i --restart=Never \
              -n ${{ env.KUBERNETES_NAMESPACE }} \
              -- curl -f http://academic-year-system/api/health && break || sleep 10
          done
      
      - name: Run integration tests
        run: |
          kubectl run integration-test \
            --image=${{ needs.build.outputs.image-tag }} \
            --rm -i --restart=Never \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            --env="NODE_ENV=production" \
            -- npm run test:integration:smoke
      
      - name: Monitor deployment
        run: |
          kubectl get pods -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl get services -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl get ingress -n ${{ env.KUBERNETES_NAMESPACE }}
      
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/academic-year-system \
            -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl rollout status deployment/academic-year-system \
            -n ${{ env.KUBERNETES_NAMESPACE }}
      
      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Academic Year System deployed to production'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Create GitHub release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: academic-year-v${{ github.run_number }}
          release_name: Academic Year System v${{ github.run_number }}
          body: |
            ## Academic Year Automation System Deployment
            
            **Commit:** ${{ github.sha }}
            **Image:** ${{ needs.build.outputs.image-tag }}
            **Digest:** ${{ needs.build.outputs.image-digest }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
