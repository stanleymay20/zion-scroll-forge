apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: academic-year-ingress
  namespace: academic-year-system
  labels:
    app: scrolluniversity
    component: academic-year-automation
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    
    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://scrolluniversity.com,https://www.scrolluniversity.com,https://admin.scrolluniversity.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';";
    
    # SSL/TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: "http01"
    
    # AWS ALB (Alternative to NGINX)
    # alb.ingress.kubernetes.io/scheme: "internet-facing"
    # alb.ingress.kubernetes.io/target-type: "ip"
    # alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:123456789012:certificate/..."
    # alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS-1-2-2017-01"
    # alb.ingress.kubernetes.io/healthcheck-path: "/api/health"
    # alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    # alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    # alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    # alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
spec:
  tls:
  - hosts:
    - api.scrolluniversity.com
    - academic-year.scrolluniversity.com
    secretName: academic-year-tls-cert
  rules:
  - host: api.scrolluniversity.com
    http:
      paths:
      - path: /api/academic-calendar
        pathType: Prefix
        backend:
          service:
            name: academic-year-system
            port:
              number: 80
      - path: /api/admissions
        pathType: Prefix
        backend:
          service:
            name: academic-year-system
            port:
              number: 80
      - path: /api/registration
        pathType: Prefix
        backend:
          service:
            name: academic-year-system
            port:
              number: 80
      - path: /api/students
        pathType: Prefix
        backend:
          service:
            name: academic-year-system
            port:
              number: 80
      - path: /api/graduation
        pathType: Prefix
        backend:
          service:
            name: academic-year-system
            port:
              number: 80
      - path: /api/faculty
        pathType: Prefix
        backend:
          service:
            name: academic-year-system
            port:
              number: 80
      - path: /api/courses
        pathType: Prefix
        backend:
          service:
            name: academic-year-system
            port:
              number: 80
      - path: /api/workflows
        pathType: Prefix
        backend:
          service:
            name: academic-year-system
            port:
              number: 80
      - path: /api/notifications
        pathType: Prefix
        backend:
          service:
            name: academic-year-system
            port:
              number: 80
  - host: academic-year.scrolluniversity.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: academic-year-system
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: academic-year-network-policy
  namespace: academic-year-system
spec:
  podSelector:
    matchLabels:
      app: scrolluniversity
      component: academic-year-automation
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: scrolluniversity
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 9090
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow external HTTPS (for AI APIs, email, etc.)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 465
