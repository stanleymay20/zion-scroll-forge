apiVersion: v1
kind: Namespace
metadata:
  name: academic-year-system
  labels:
    name: academic-year-system
    app: scrolluniversity
    component: academic-year-automation
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: academic-year-quota
  namespace: academic-year-system
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: academic-year-limits
  namespace: academic-year-system
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: "1"
      memory: 2Gi
    defaultRequest:
      cpu: 500m
      memory: 1Gi
    type: Container
